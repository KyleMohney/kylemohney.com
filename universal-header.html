<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kyle Mohney's Portfolio</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header class="universal-header">
        <div class="header-left">
            <img src="../assets/images/kyle.png" alt="Kyle Mohney" class="profile-pic">
            <span class="header-name">
                Kyle Mohney
                <span class="header-name-glow"></span>
            </span>
        </div>
        <nav>
            <div class="nav-links" id="navLinks">
                <a href="index.html" class="nav-link active">Home</a>
                <a href="resume.html" class="nav-link">Resume</a>
                <a href="about.html" class="nav-link">About</a>
                <a href="projects.html" class="nav-link">Projects</a>
                <a href="articles.html" class="nav-link">Articles</a>
                <a href="contact.html" class="nav-link">Contact</a>
            </div>
            <div class="header-icons">
                <button class="header-icon-btn" id="settings-btn" title="Settings"><span>&#9881;</span></button>
                <button class="header-icon-btn" id="help-btn" title="Help"><span>?</span></button>
                <button class="header-icon-btn" id="lang-btn" title="Language">EN</button>
            </div>
            <div class="hamburger" id="hamburger" aria-label="Open navigation" tabindex="0">
                <span></span>
                <span></span>
                <span></span>
            </div>
        </nav>
    </header>
    <!-- Modals for Settings and Help -->
    <div id="settings-modal" style="display:none; position:fixed; top:0; left:0; width:100vw; height:100vh; background:rgba(24,28,36,0.65); z-index:2000; align-items:center; justify-content:center;">
        <div style="background:#232a36; padding:32px 40px; border-radius:18px; box-shadow:0 8px 32px rgba(0,0,0,0.25); min-width:320px; max-width:90vw; text-align:center;">
            <h2 style="font-size:1.3em; font-weight:800; margin-bottom:18px;">Settings</h2>
            <p style="font-size:1.08em; margin-bottom:18px;">Settings coming soon.</p>
            <button onclick="closeModal('settings-modal')" style="background:#181c24; color:#e0e7e9; border:none; border-radius:6px; padding:8px 18px; font-weight:700; cursor:pointer;">Close</button>
        </div>
    </div>
    <div id="help-modal" style="display:none; position:fixed; top:0; left:0; width:100vw; height:100vh; background:rgba(24,28,36,0.65); z-index:2000; align-items:center; justify-content:center;">
        <div style="background:#232a36; padding:32px 40px; border-radius:18px; box-shadow:0 8px 32px rgba(0,0,0,0.25); min-width:320px; max-width:90vw; text-align:center;">
            <h2 style="font-size:1.3em; font-weight:800; margin-bottom:18px;">Help & Support</h2>
            <p style="font-size:1.08em; margin-bottom:18px;">Help content coming soon.</p>
            <button onclick="closeModal('help-modal')" style="background:#181c24; color:#e0e7e9; border:none; border-radius:6px; padding:8px 18px; font-weight:700; cursor:pointer;">Close</button>
        </div>
    </div>
    <script>
        // Hamburger menu
        var hamburger = document.getElementById('hamburger');
        var navLinks = document.getElementById('navLinks');
        hamburger.addEventListener('click', function() {
            navLinks.classList.toggle('open');
        });
        hamburger.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') navLinks.classList.toggle('open');
        });

        // Settings & Help modal logic
        document.getElementById('settings-btn').onclick = function(e) {
            e.stopPropagation();
            document.getElementById('settings-modal').style.display = 'flex';
        };
        document.getElementById('help-btn').onclick = function(e) {
            e.stopPropagation();
            document.getElementById('help-modal').style.display = 'flex';
        };
        function closeModal(id) {
            document.getElementById(id).style.display = 'none';
        }
        document.addEventListener('click', function(e) {
            if (document.getElementById('settings-modal').style.display === 'flex') document.getElementById('settings-modal').style.display = 'none';
            if (document.getElementById('help-modal').style.display === 'flex') document.getElementById('help-modal').style.display = 'none';
        });
        document.getElementById('settings-modal').onclick = function(e) { e.stopPropagation(); };
        document.getElementById('help-modal').onclick = function(e) { e.stopPropagation(); };

        // Language dropdown (simple toggle)
        const langBtn = document.getElementById('lang-btn');
        langBtn.addEventListener('click', function(e) {
            e.stopPropagation();
            // Example: cycle through languages
            const langs = ['EN', 'ES', 'FR', 'DE', 'ZH'];
            let current = langs.indexOf(langBtn.textContent.trim());
            langBtn.textContent = langs[(current + 1) % langs.length];
        });
    </script>
</body>
</html>
