<!-- ======================================================
     CLIENT SIGNUP — Rooted Vitality
     ====================================================== -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up | Rooted Vitality</title>
  <meta name="description" content="Create your Rooted Vitality Client account and begin your holistic wellness journey.">
  <link rel="stylesheet" href="./styles/base.css">
  <link rel="stylesheet" href="./styles/layout.css">
  <link rel="stylesheet" href="./styles/components.css">
  <link rel="stylesheet" href="./styles/pages.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./scripts/config.js"></script>
</head>
<body>
  <!-- Header injected by injections.js -->
  <div id="header-inject"></div>

  <main class="signup-container">
    <section class="signup-hero">
      <h1>Start Your Wellness Journey</h1>
      <p>Create your Rooted Vitality account to connect with trusted practitioners and track your wellness goals.</p>
    </section>

    <form id="rvSignupForm" class="signup-form">
      <div class="form-grid">
        <div>
          <label for="firstName">First Name *</label>
          <input type="text" id="firstName" required>
        </div>
        <div>
          <label for="lastName">Last Name *</label>
          <input type="text" id="lastName" required>
        </div>
        <div>
          <label for="email">Email Address *</label>
          <input type="email" id="email" required>
        </div>
        <div>
          <label for="phone">Phone Number *</label>
          <input type="tel" id="phone" required>
        </div>
        <div>
          <label for="password">Password *</label>
          <input type="password" id="password" required minlength="6">
        </div>
        <div>
          <label for="confirmPassword">Confirm Password *</label>
          <input type="password" id="confirmPassword" required minlength="6">
        </div>
        <div>
          <label for="age">Age</label>
          <input type="number" id="age" min="0">
        </div>
        <div>
          <label for="sex">Sex</label>
          <select id="sex">
            <option value="">Select</option>
            <option value="Female">Female</option>
            <option value="Male">Male</option>
            <option value="Intersex">Intersex</option>
            <option value="Prefer not to say">Prefer not to say</option>
          </select>
        </div>
        <div>
          <label for="gender">Gender</label>
          <input type="text" id="gender" placeholder="Optional">
        </div>
      </div>

      <div class="signup-consent">
        <label>
          <input type="checkbox" id="terms" required>
          I agree to the <a href="./policies/terms-of-service.html" target="_blank">Terms of Service</a> and <a href="./policies/privacy-policy.html" target="_blank">Privacy Policy</a>.
        </label>
      </div>

      <button type="submit" class="signup-submit">Create My Account</button>

      <p class="signup-alt">Practitioner signup <strong>coming soon</strong>.</p>
    </form>
  </main>

  <!-- Footer injected by injections.js -->
  <footer id="footer-inject"></footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./scripts/config.js"></script>
  <script src="./scripts/authManager.js"></script>
  <script src="./scripts/authModal.js"></script>
  <script src="./scripts/authHooks.js"></script>
  <script src="./injections.js"></script>
  <script src="./scripts/signupHandler.js"></script>
</body>
</html>
