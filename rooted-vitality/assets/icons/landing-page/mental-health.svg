<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <!-- Head -->
  <circle cx="50" cy="30" r="10" fill="none"/>
  <!-- Face: left eye -->
  <circle cx="46" cy="28" r="2" fill="currentColor"/>
  <!-- Face: right eye -->
  <circle cx="54" cy="28" r="2" fill="currentColor"/>
  <!-- Smile -->
  <path d="M 46 32 Q 50 34 54 32" fill="none"/>
  <!-- Ears/chakras on side -->
  <circle cx="40" cy="30" r="2" fill="currentColor"/>
  <circle cx="60" cy="30" r="2" fill="currentColor"/>
  <!-- Body/heart -->
  <path d="M 50 42 L 50 65" fill="none" stroke-width="2"/>
  <!-- Left hand to heart -->
  <path d="M 35 50 L 45 55" fill="none"/>
  <!-- Right hand to heart -->
  <path d="M 65 50 L 55 55" fill="none"/>
  <!-- Heart symbol -->
  <path d="M 50 55 Q 45 50 42 52 Q 40 54 42 58 Q 45 62 50 65 Q 55 62 58 58 Q 60 54 58 52 Q 55 50 50 55" fill="none"/>
</svg>