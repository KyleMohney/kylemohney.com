<!--
  ========================================== 
  FILE: header_practitioner.html
  PROJECT: Rooted Vitality Platform
  PURPOSE: Practitioner (Logged-in) Navigation Header Component
  BRANDING: Official Rooted Vitality Colors & Styling
  ========================================== 

  TABLE OF CONTENTS:
  1. Header Container & Logo
  2. Practitioner Navigation Links
  3. Notifications Menu
  4. Avatar & Account Menu
  5. Mobile Menu Toggle

  ========================================== 
-->

<!-- ========================================== -->
<!-- 1. HEADER CONTAINER & LOGO               -->
<!-- ========================================== -->
<header id="rvHeader" class="rv-header rv-header-practitioner">
  <div class="rv-header-inner container-wide">
    <a href="/rooted-vitality/dashboard/pro/pages/index.html" class="rv-logo rv-logo-practitioner" aria-label="Rooted Vitality Practitioner Dashboard">
      <img src="/rooted-vitality/assets/logo_trimmed.png" alt="Rooted Vitality" class="rv-logo-img">
      <span class="rv-brand-text">
        <span class="rv-brand-name">Rooted</span>
        <span class="rv-brand-name">Vitality</span>
      </span>
    </a>
    
    <!-- ========================================== -->
    <!-- 2. PRACTITIONER NAVIGATION LINKS         -->
    <!-- ========================================== -->
    <nav class="rv-nav" aria-label="Practitioner Navigation">
      <!-- Main Navigation Buttons -->
      <a href="/rooted-vitality/dashboard/pro/pages/index.html" class="rv-nav-link">Clients</a>
      <a href="/rooted-vitality/dashboard/pro/pages/inbox.html" class="rv-nav-link">Inbox</a>
      <a href="/rooted-vitality/dashboard/pro/pages/match-settings.html" class="rv-nav-link">Match Settings</a>
      <a href="/rooted-vitality/dashboard/pro/pages/profile.html" class="rv-nav-link">Profile</a>
    </nav>
    
    <!-- ========================================== -->
    <!-- 3. NOTIFICATIONS MENU                    -->
    <!-- ========================================== -->
    <!-- Notifications Bell (Outside Nav) -->
    <div class="rv-notifications-menu">
      <button class="rv-nav-icon-btn rv-notifications-btn" aria-label="Notifications" aria-haspopup="true" aria-expanded="false" title="Notifications">
        <svg class="rv-bell-icon" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
          <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
        </svg>
        <span class="rv-notification-badge"></span>
      </button>
      <div class="rv-notifications-dropdown" role="menu">
        <div class="rv-notifications-header">
          <h3>Notifications</h3>
        </div>
        <div class="rv-notifications-list">
          <p class="rv-notifications-empty">No notifications yet</p>
        </div>
      </div>
    </div>
    
    <!-- ========================================== -->
    <!-- 4. AVATAR & ACCOUNT MENU                 -->
    <!-- ========================================== -->
    <!-- Avatar Menu (Outside Nav) -->
    <div class="rv-avatar-menu">
      <button class="rv-avatar-btn" aria-label="Account menu" aria-haspopup="true" aria-expanded="false">
        <span class="rv-avatar-initial" id="rvAvatarInitial">U</span>
      </button>
      <div class="rv-avatar-dropdown" role="menu">
        <a href="#" onclick="navigateToPage('settings'); return false;" role="menuitem" class="rv-dropdown-item">Settings</a>
        <hr class="rv-dropdown-divider">
        <a href="#" data-switch-view="client" role="menuitem" class="rv-dropdown-item">Client View</a>
        <a href="#" onclick="if(window.authManager) window.authManager.logout(); return false;" role="menuitem" class="rv-dropdown-item rv-logout-item">Sign Out</a>
      </div>
    </div>
    
    <!-- ========================================== -->
    <!-- 5. MOBILE MENU TOGGLE                    -->
    <!-- ========================================== -->
    <button class="rv-menu-toggle" aria-label="Toggle Menu" aria-expanded="false">☰</button>
  </div>
</header>
