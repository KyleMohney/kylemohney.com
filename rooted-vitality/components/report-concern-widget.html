<!--
  ========================================== 
  FILE: report-concern-widget.html
  PROJECT: Rooted Vitality Platform
  PURPOSE: Universal Report a Concern Widget - Reusable component for all pages
  BRANDING: Official Rooted Vitality Colors & Styling
  ========================================== 

  TABLE OF CONTENTS:
  1. Footer Button Container
  2. Report Concern Modal (Dialog)
  3. Modal Header & Close
  4. Form Fields (Category, Title, Section, Description, Priority, Email, Device)
  5. Form Actions (Cancel/Submit)

  ========================================== 

  SCOPE NOTES:
  - All class names prefixed with "report-concern-" for component isolation
  - Modal functionality contained to this widget only
  - Form IDs are unique to prevent conflicts with other forms
  - Warning: Some classes (.modal, .form-group, .btn-*) may conflict with global styles
  
  ========================================== 
-->

<!-- ========================================== -->
<!-- 1. FOOTER BUTTON CONTAINER               -->
<!-- ========================================== -->
<div id="report-concern-footer" class="report-concern-footer">
    <button id="report-concern-btn" class="report-concern-link" title="Report a technical issue or concern with the website">
        Report a Concern
    </button>
</div>

<!-- ========================================== -->
<!-- 2. REPORT CONCERN MODAL (DIALOG)        -->
<!-- ========================================== -->
<!-- Report Concern Modal -->
<div id="report-concern-modal" class="modal">
    <div class="modal-overlay"></div>
    <div class="modal-content">
        
        <!-- ========================================== -->
        <!-- 3. MODAL HEADER & CLOSE                  -->
        <!-- ========================================== -->
        <div class="modal-header">
            <h2>Report a Concern</h2>
            <button class="modal-close-btn" id="report-concern-close-btn">×</button>
        </div>
        
        <!-- ========================================== -->
        <!-- 4. FORM FIELDS                           -->
        <!-- ========================================== -->
        <div class="modal-body">
        <form id="report-concern-form">
            
            <!-- Category Selection -->
            <div class="form-group">
                <label for="report-category">Category *</label>
                <select id="report-category" name="category" required>
                    <option value="">Select a category...</option>
                    <option value="technical-issue">Technical Issue / Bug</option>
                    <option value="malfunction">Feature Malfunction</option>
                    <option value="performance">Performance Issue</option>
                    <option value="ui-problem">UI/UX Problem</option>
                    <option value="content-issue">Content Error</option>
                    <option value="security-concern">Security Concern</option>
                    <option value="other">Other Concern</option>
                </select>
            </div>

            <!-- Title -->
            <div class="form-group">
                <label for="report-title">Title of Issue *</label>
                <input 
                    type="text" 
                    id="report-title" 
                    name="title" 
                    placeholder="Brief description of the problem"
                    maxlength="100"
                    required
                >
            </div>

            <!-- Page/Section -->
            <div class="form-group">
                <label for="report-section">Page/Section *</label>
                <input 
                    type="text" 
                    id="report-section" 
                    name="section" 
                    placeholder="e.g., Practitioner Dashboard, Search Page"
                    value=""
                    required
                >
            </div>

            <!-- Description -->
            <div class="form-group">
                <label for="report-description">Description of Issue *</label>
                <textarea 
                    id="report-description" 
                    name="description" 
                    placeholder="Please describe what happened, what you expected to happen, and any error messages you saw"
                    rows="5"
                    maxlength="1000"
                    required
                ></textarea>
            </div>

            <!-- Priority -->
            <div class="form-group">
                <label for="report-priority">Priority Level *</label>
                <select id="report-priority" name="priority" required>
                    <option value="">Select priority...</option>
                    <option value="low">Low - Minor inconvenience</option>
                    <option value="medium">Medium - Affects functionality</option>
                    <option value="high">High - Prevents key features</option>
                    <option value="critical">Critical - Website not usable</option>
                </select>
            </div>

            <!-- Contact Email -->
            <div class="form-group">
                <label for="report-email">Your Email *</label>
                <input 
                    type="email" 
                    id="report-email" 
                    name="email" 
                    placeholder="your@email.com"
                    required
                >
            </div>

            <!-- Browser/Device Info (auto-filled) -->
            <div class="form-group">
                <label for="report-device">Device/Browser</label>
                <input 
                    type="text" 
                    id="report-device" 
                    name="device" 
                    placeholder="Auto-detected"
                    readonly
                >
                <small>Auto-detected for troubleshooting purposes</small>
            </div>

            <!-- ========================================== -->
            <!-- 5. FORM ACTIONS (CANCEL/SUBMIT)          -->
            <!-- ========================================== -->
            <!-- Form Actions -->
            <div class="form-actions">
                <button type="button" class="btn-modal btn-modal-secondary" id="report-concern-cancel-btn">Cancel</button>
                <button type="submit" class="btn-modal btn-modal-primary" id="report-concern-submit-btn">Submit Report</button>
            </div>
        </form>
        </div>
    </div>
</div>

<script>
  // ======================================================
  // CLOSE BUTTON & FORM LISTENERS (Fallback)
  // NOTE: Primary listeners are in report-concern-universal.js
  // This script is a fallback if the component is used directly
  // ======================================================
  function setupReportConcernListeners() {
    // Check if already initialized by report-concern-universal.js
    if (window.reportConcernListenersSetup) {
      return;
    }
    
    // Close button (X)
    const closeBtn = document.getElementById('report-concern-close-btn');
    if (closeBtn) {
      closeBtn.addEventListener('click', (e) => {
        e.preventDefault();
        if (typeof closeReportConcernModal === 'function') {
          closeReportConcernModal();
        }
      });
    }
    
    // Cancel button
    const cancelBtn = document.getElementById('report-concern-cancel-btn');
    if (cancelBtn) {
      cancelBtn.addEventListener('click', (e) => {
        e.preventDefault();
        if (typeof closeReportConcernModal === 'function') {
          closeReportConcernModal();
        }
      });
    }
    
    // Form submission
    const form = document.getElementById('report-concern-form');
    if (form) {
      form.addEventListener('submit', (event) => {
        event.preventDefault();
        if (typeof submitReportConcern === 'function') {
          submitReportConcern(event);
        }
      });
    }
  }
  
  // Initialize on DOM ready
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', setupReportConcernListeners);
  } else {
    setupReportConcernListeners();
  }
</script>
