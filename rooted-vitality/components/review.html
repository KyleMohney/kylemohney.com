<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Leave a review for your Rooted Vitality practitioner">
  <title>Leave a Review | Rooted Vitality</title>
  <link rel="stylesheet" href="../styles/styles.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: linear-gradient(135deg, var(--rooted-primary) 0%, var(--rooted-primary-dark) 100%);
      min-height: 100vh;
      padding: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .review-container {
      background: var(--rooted-neutral);
      border-radius: 12px;
      box-shadow: var(--card-shadow-hover);
      max-width: 600px;
      width: 100%;
      padding: 40px;
    }

    .review-header {
      margin-bottom: 30px;
      text-align: center;
    }

    .review-header h1 {
      font-size: 28px;
      color: var(--rooted-dark);
      margin-bottom: 10px;
    }

    .review-header p {
      color: var(--card-text-secondary);
      font-size: 16px;
    }

    .practitioner-info {
      display: flex;
      align-items: center;
      gap: 15px;
      padding: 15px;
      background: var(--card-bg-gradient-light);
      border-radius: 8px;
      margin-bottom: 30px;
      border: 1px solid var(--card-border-light);
    }

    .practitioner-avatar {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      object-fit: cover;
      background: var(--card-border-light);
    }

    .practitioner-details h3 {
      font-size: 18px;
      color: var(--rooted-dark);
      margin-bottom: 4px;
    }

    .practitioner-details p {
      color: var(--card-text-secondary);
      font-size: 14px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      margin-bottom: 8px;
      font-weight: 600;
      color: var(--rooted-dark);
      font-size: 14px;
    }

    .form-group input,
    .form-group textarea,
    .form-group select {
      width: 100%;
      padding: 12px;
      border: 1px solid var(--card-border-light);
      border-radius: 6px;
      font-family: inherit;
      font-size: 14px;
      transition: border-color 0.2s;
    }

    .form-group input:focus,
    .form-group textarea:focus,
    .form-group select:focus {
      outline: none;
      border-color: var(--rooted-primary);
      box-shadow: 0 0 0 3px var(--primary-opacity-10);
    }

    .form-group textarea {
      resize: vertical;
      min-height: 120px;
    }

    .rating-group {
      display: flex;
      gap: 10px;
      margin-top: 8px;
    }

    .star-rating {
      display: flex;
      gap: 5px;
    }

    .star {
      font-size: 32px;
      cursor: pointer;
      color: var(--card-border-light);
      transition: color 0.2s;
    }

    .star:hover,
    .star.active {
      color: var(--rooted-accent);
    }

    .rating-label {
      align-self: center;
      color: var(--card-text-secondary);
      font-size: 14px;
      margin-left: 10px;
    }

    .photo-upload {
      position: relative;
      margin-bottom: 20px;
    }

    .photo-upload input[type="file"] {
      display: none;
    }

    .photo-upload-button {
      padding: 12px 16px;
      border: 2px dashed var(--card-border-light);
      border-radius: 6px;
      background: var(--card-bg-gradient-light);
      cursor: pointer;
      text-align: center;
      font-size: 14px;
      color: var(--card-text-secondary);
      transition: all 0.2s;
    }

    .photo-upload-button:hover {
      border-color: var(--rooted-primary);
      background: var(--primary-opacity-05);
    }

    .photo-preview {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(80px, 1fr));
      gap: 10px;
      margin-top: 10px;
    }

    .photo-item {
      position: relative;
      width: 80px;
      height: 80px;
      border-radius: 6px;
      overflow: hidden;
      background: var(--card-border-light);
    }

    .photo-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .photo-remove {
      position: absolute;
      top: -8px;
      right: -8px;
      width: 24px;
      height: 24px;
      background: var(--status-danger);
      color: white;
      border: none;
      border-radius: 50%;
      cursor: pointer;
      font-size: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transition: opacity 0.2s;
    }

    .photo-item:hover .photo-remove {
      opacity: 1;
    }

    .form-actions {
      display: flex;
      gap: 10px;
      margin-top: 30px;
    }

    .btn {
      flex: 1;
      padding: 12px 24px;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-submit {
      background: linear-gradient(135deg, var(--rooted-primary) 0%, var(--rooted-primary-dark) 100%);
      color: var(--rooted-neutral);
    }

    .btn-submit:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: var(--card-shadow-hover);
    }

    .btn-submit:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .btn-cancel {
      background: var(--primary-opacity-10);
      color: var(--rooted-dark);
    }

    .btn-cancel:hover {
      background: var(--primary-opacity-15);
    }

    .error-message {
      background: rgba(212, 50, 50, 0.1);
      color: var(--status-danger-dark);
      padding: 12px;
      border-radius: 6px;
      margin-bottom: 20px;
      font-size: 14px;
      display: none;
      border-left: 4px solid var(--status-danger);
    }

    .error-message.show {
      display: block;
    }

    .success-message {
      background: rgba(16, 185, 129, 0.1);
      color: var(--status-success-dark);
      padding: 12px;
      border-radius: 6px;
      margin-bottom: 20px;
      font-size: 14px;
      display: none;
      border-left: 4px solid var(--status-success);
    }

    .success-message.show {
      display: block;
    }

    .loading {
      display: inline-block;
      width: 14px;
      height: 14px;
      border: 2px solid var(--rooted-neutral);
      border-top-color: transparent;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .review-limit-warning {
      background: var(--status-warning);
      color: var(--status-warning-dark);
      padding: 12px;
      border-radius: 6px;
      margin-bottom: 20px;
      font-size: 14px;
      display: none;
      border-left: 4px solid var(--status-warning-dark);
    }

    .review-limit-warning.show {
      display: block;
    }

    @media (max-width: 600px) {
      .review-container {
        padding: 20px;
      }

      .review-header h1 {
        font-size: 24px;
      }

      .practitioner-info {
        flex-direction: column;
        text-align: center;
      }
    }
  </style>
</head>
<body>
  <div class="review-container">
    <!-- Header -->
    <div class="review-header">
      <h1>Leave a Review</h1>
      <p>Share your experience with this practitioner</p>
    </div>

    <!-- Error Messages -->
    <div class="error-message" id="errorMessage"></div>
    <div class="success-message" id="successMessage"></div>
    <div class="review-limit-warning" id="reviewLimitWarning">
      ⚠️ You have already left 3 reviews for this practitioner. No additional reviews can be submitted.
    </div>

    <!-- Practitioner Info -->
    <div class="practitioner-info" id="practitionerInfo">
      <img src="" alt="Practitioner" class="practitioner-avatar" id="practitionerAvatar">
      <div class="practitioner-details">
        <h3 id="practitionerName">Loading...</h3>
        <p id="practitionerSpecialty"></p>
      </div>
    </div>

    <!-- Form -->
    <form id="reviewForm">
      <!-- Name -->
      <div class="form-group">
        <label for="clientName">Your Name *</label>
        <input 
          type="text" 
          id="clientName" 
          name="clientName" 
          required
          placeholder="First and last name"
        >
      </div>

      <!-- Email -->
      <div class="form-group">
        <label for="clientEmail">Your Email *</label>
        <input 
          type="email" 
          id="clientEmail" 
          name="clientEmail" 
          required
          placeholder="your@email.com"
        >
      </div>

      <!-- Category of Care -->
      <div class="form-group">
        <label for="categoryId">Category of Care *</label>
        <select 
          id="categoryId" 
          name="categoryId" 
          required
        >
          <option value="">Select a category...</option>
        </select>
      </div>

      <!-- Rating -->
      <div class="form-group">
        <label>Your Rating *</label>
        <div class="rating-group">
          <div class="star-rating" id="starRating">
            <span class="star" data-rating="1">★</span>
            <span class="star" data-rating="2">★</span>
            <span class="star" data-rating="3">★</span>
            <span class="star" data-rating="4">★</span>
            <span class="star" data-rating="5">★</span>
          </div>
          <span class="rating-label" id="ratingLabel">Select a rating</span>
        </div>
      </div>

      <!-- Review Text -->
      <div class="form-group">
        <label for="reviewText">Your Review *</label>
        <textarea 
          id="reviewText" 
          name="reviewText" 
          required
          placeholder="Tell us about your experience. What was helpful? What would you recommend?"
        ></textarea>
      </div>

      <!-- Photo Upload -->
      <div class="photo-upload">
        <label>Photos (Optional)</label>
        <input 
          type="file" 
          id="photoInput" 
          name="photos" 
          multiple
          accept="image/*"
        >
        <div class="photo-upload-button" onclick="document.getElementById('photoInput').click()">
          📷 Click to upload photos (max 5 MB each)
        </div>
        <div class="photo-preview" id="photoPreview"></div>
      </div>

      <!-- Actions -->
      <div class="form-actions">
        <button type="button" class="btn btn-cancel" onclick="window.history.back()">Cancel</button>
        <button type="submit" class="btn btn-submit" id="submitBtn">
          Submit Review
        </button>
      </div>
    </form>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    // Initialize Supabase
    const SUPABASE_URL = 'https://nguwgabvfwzwvpykxkdz.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5ndXdnYWJ2Znd6d3ZweWt4a2R6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3MzIwOTA1OTIsImV4cCI6MjA0NzY2NjU5Mn0.Bpo9u3K_fFmj5yWJKjBnhUSfZAi-6PzJEwlZHQ9qEJI';
    const CORS_PROXY = 'https://cors-anywhere.herokuapp.com/';
    
    // Debug logging
    console.log('Review page loading...');
    console.log('Current page URL:', window.location.href);
    console.log('Page origin:', window.location.origin);
    console.log('Page protocol:', window.location.protocol);
    console.log('Supabase URL:', SUPABASE_URL);
    
    // Detect if we're in local development with http
    const isLocalHttp = window.location.protocol === 'http:' && 
                        (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1');
    
    if (isLocalHttp) {
      console.warn('⚠️ Mixed Content detected: http page accessing https API');
      console.warn('Solution: Access page via https:// or configure your server to serve over https');
      console.warn('Using CORS proxy as fallback for local development');
    }
    
    let supabaseClient = null;
    try {
      supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
      console.log('Supabase client created successfully');
    } catch (e) {
      console.error('Failed to create Supabase client:', e);
    }

    let selectedRating = 0;
    let selectedCategory = null;
    let selectedPhotos = [];
    let practitionerId = null;
    let practitionerData = null;

    // Direct fetch helper with CORS proxy fallback
    async function fetchWithFallback(url, options = {}) {
      console.log('Fetching:', url);
      
      try {
        // Try direct fetch first
        const response = await fetch(url, {
          ...options,
          headers: {
            'apikey': SUPABASE_KEY,
            'Authorization': `Bearer ${SUPABASE_KEY}`,
            'Content-Type': 'application/json',
            ...options.headers
          }
        });
        
        if (!response.ok) {
          throw new Error(`HTTP error! status: ${response.status}`);
        }
        
        return await response.json();
      } catch (error) {
        console.log('Direct fetch failed, trying CORS proxy...');
        
        // Try with CORS proxy
        try {
          const proxyUrl = CORS_PROXY + url;
          console.log('Proxy URL:', proxyUrl);
          
          const response = await fetch(proxyUrl, {
            ...options,
            headers: {
              'apikey': SUPABASE_KEY,
              'Authorization': `Bearer ${SUPABASE_KEY}`,
              'Content-Type': 'application/json',
              ...options.headers
            }
          });
          
          if (!response.ok) {
            throw new Error(`HTTP error! status: ${response.status}`);
          }
          
          return await response.json();
        } catch (proxyError) {
          console.error('Both direct and proxy fetch failed:', proxyError);
          throw error; // throw original error
        }
      }
    }

    // Initialize
    async function init() {
      try {
        if (!supabaseClient) {
          showError('Failed to initialize connection. Please refresh the page.');
          return;
        }

        // Get practitioner ID from URL
        const params = new URLSearchParams(window.location.search);
        practitionerId = params.get('practitioner');

        console.log('Practitioner ID from URL:', practitionerId);

        if (!practitionerId) {
          showError('Missing practitioner ID. Invalid review link.');
          return;
        }

        // Fetch practitioner info
        console.log('Fetching practitioner info...');
        await fetchPractitionerInfo();

        // Load taxonomy categories
        console.log('Loading categories...');
        await loadCategories();

        // Check review count
        console.log('Checking review limit...');
        await checkReviewLimit();

        console.log('Initialization complete');
      } catch (error) {
        console.error('Init error:', error);
        showError('Failed to load review form. Please try again.');
      }
    }

    // Setup all event listeners
    function setupEventListeners() {
      // Star rating handler
      document.querySelectorAll('.star').forEach(star => {
        star.addEventListener('click', function() {
          selectedRating = parseInt(this.dataset.rating);
          updateStarDisplay();
          updateRatingLabel();
        });

        star.addEventListener('mouseover', function() {
          const hoverRating = parseInt(this.dataset.rating);
          document.querySelectorAll('.star').forEach((s, idx) => {
            s.classList.toggle('active', idx < hoverRating);
          });
        });
      });

      const starRating = document.getElementById('starRating');
      if (starRating) {
        starRating.addEventListener('mouseout', updateStarDisplay);
      }

      // Category selection handler
      const categorySelect = document.getElementById('categoryId');
      if (categorySelect) {
        categorySelect.addEventListener('change', function() {
          selectedCategory = this.value || null;
        });
      }
    }

    // Load taxonomy categories
    async function loadCategories() {
      try {
        console.log('Querying holistic_health_taxonomy table...');
        
        // Try Supabase client first
        const { data: categories, error } = await supabaseClient
          .from('holistic_health_taxonomy')
          .select('id, name')
          .eq('is_active', true)
          .order('display_order', { ascending: true });

        if (error) {
          console.error('Supabase client error:', error.message);
          throw new Error('Supabase client failed');
        }

        if (!categories || categories.length === 0) {
          throw new Error('No categories available');
        }

        console.log('Categories loaded via Supabase client:', categories.length);
        populateCategories(categories);

      } catch (clientError) {
        console.log('Supabase client failed, using direct API call...');
        
        try {
          // Fallback to direct API call
          const url = `https://nguwgabvfwzwvpykxkdz.supabase.co/rest/v1/holistic_health_taxonomy?is_active=eq.true&order=display_order.asc`;
          const categories = await fetchWithFallback(url);
          
          if (!categories || categories.length === 0) {
            throw new Error('No categories available');
          }
          
          console.log('Categories loaded via direct API:', categories.length);
          populateCategories(categories);
        } catch (apiError) {
          console.error('Direct API also failed:', apiError);
          showError(`Failed to load categories: ${apiError.message}`);
        }
      }
    }

    // Helper to populate category dropdown
    function populateCategories(categories) {
      const select = document.getElementById('categoryId');
      if (!select) {
        console.error('Category select element not found');
        return;
      }

      categories.forEach(cat => {
        const option = document.createElement('option');
        option.value = cat.id;
        option.textContent = cat.name;
        select.appendChild(option);
      });

      console.log('Categories populated in dropdown');
    }

    // Fetch practitioner info
    async function fetchPractitionerInfo() {
      try {
        console.log('Querying practitioners table for ID:', practitionerId);
        
        // Try Supabase client first
        const { data: practitioner, error } = await supabaseClient
          .from('practitioners')
          .select('id, full_name, specialty, avatar_url')
          .eq('id', practitionerId)
          .single();

        if (error) {
          console.error('Supabase client error:', error.message);
          throw new Error('Supabase client failed');
        }

        if (!practitioner) {
          console.error('No practitioner found with ID:', practitionerId);
          showError('Practitioner not found.');
          return;
        }

        console.log('Practitioner data loaded:', practitioner);
        practitionerData = practitioner;

      } catch (clientError) {
        console.log('Supabase client failed, using direct API call...');
        
        try {
          // Fallback to direct API call
          const url = `https://nguwgabvfwzwvpykxkdz.supabase.co/rest/v1/practitioners?id=eq.${practitionerId}&select=id,full_name,specialty,avatar_url`;
          const data = await fetchWithFallback(url);
          
          if (!data || data.length === 0) {
            throw new Error('Practitioner not found');
          }
          
          practitionerData = data[0];
          console.log('Practitioner data loaded via direct API:', practitionerData);
        } catch (apiError) {
          console.error('Direct API also failed:', apiError);
          showError(`Failed to load practitioner: ${apiError.message}`);
          return;
        }
      }

      if (!practitionerData) {
        showError('Practitioner not found.');
        return;
      }

      // Display practitioner info
      document.getElementById('practitionerName').textContent = practitionerData.full_name || 'Practitioner';
      document.getElementById('practitionerSpecialty').textContent = practitionerData.specialty || 'Holistic Wellness';
      
      if (practitionerData.avatar_url) {
        document.getElementById('practitionerAvatar').src = practitionerData.avatar_url;
      } else {
        document.getElementById('practitionerAvatar').src = 'data:image/svg+xml,%3Csvg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"%3E%3Crect fill="%23ddd" width="100" height="100"/%3E%3Ctext x="50" y="50" text-anchor="middle" dy=".3em" fill="%23999" font-size="50"%3E👤%3C/text%3E%3C/svg%3E';
      }

      console.log('Practitioner info displayed');
    }

    // Check review limit
    async function checkReviewLimit() {
      try {
        console.log('Checking review limit for practitioner:', practitionerId);
        const { count, error } = await supabaseClient
          .from('reviews')
          .select('*', { count: 'exact', head: true })
          .eq('practitioner_id', practitionerId)
          .eq('source', 'review-link')
          .eq('is_visible', true);

        if (error) {
          console.error('Database error checking reviews:', error);
          throw error;
        }

        console.log('Review count for this practitioner:', count);

        if (count >= 3) {
          console.log('Review limit reached - hiding form');
          document.getElementById('reviewForm').style.display = 'none';
          document.getElementById('reviewLimitWarning').classList.add('show');
          document.getElementById('submitBtn').disabled = true;
        }
      } catch (error) {
        console.error('Error checking review limit:', error);
        // Don't block form submission on error, just log it
      }
    }

    function updateStarDisplay() {
      document.querySelectorAll('.star').forEach((s, idx) => {
        s.classList.toggle('active', idx < selectedRating);
      });
    }

    function updateRatingLabel() {
      const labels = ['', '1 star', '2 stars', '3 stars', '4 stars', '5 stars'];
      document.getElementById('ratingLabel').textContent = labels[selectedRating] || 'Select a rating';
    }

    // Photo upload handler
    document.getElementById('photoInput').addEventListener('change', function(e) {
      const files = Array.from(e.target.files);
      
      files.forEach(file => {
        if (file.size > 5 * 1024 * 1024) {
          showError(`File ${file.name} is too large (max 5 MB)`);
          return;
        }

        if (!file.type.startsWith('image/')) {
          showError(`${file.name} is not an image`);
          return;
        }

        const reader = new FileReader();
        reader.onload = function(e) {
          selectedPhotos.push({
            name: file.name,
            data: e.target.result,
            file: file
          });
          renderPhotoPreviews();
        };
        reader.readAsDataURL(file);
      });

      // Reset input
      e.target.value = '';
    });

    function renderPhotoPreviews() {
      const preview = document.getElementById('photoPreview');
      preview.innerHTML = '';

      selectedPhotos.forEach((photo, idx) => {
        const div = document.createElement('div');
        div.className = 'photo-item';
        div.innerHTML = `
          <img src="${photo.data}" alt="Photo ${idx + 1}">
          <button type="button" class="photo-remove" data-index="${idx}">×</button>
        `;
        preview.appendChild(div);
      });

      // Remove button handlers
      document.querySelectorAll('.photo-remove').forEach(btn => {
        btn.addEventListener('click', (e) => {
          e.preventDefault();
          selectedPhotos.splice(parseInt(btn.dataset.index), 1);
          renderPhotoPreviews();
        });
      });
    }

    // Form submission
    document.getElementById('reviewForm').addEventListener('submit', async (e) => {
      e.preventDefault();

      if (!selectedRating) {
        showError('Please select a rating');
        return;
      }

      if (!selectedCategory) {
        showError('Please select a category of care');
        return;
      }

      const submitBtn = document.getElementById('submitBtn');
      const originalText = submitBtn.textContent;
      submitBtn.disabled = true;
      submitBtn.innerHTML = '<span class="loading"></span> Submitting...';

      try {
        const clientName = document.getElementById('clientName').value.trim();
        const clientEmail = document.getElementById('clientEmail').value.trim();
        const reviewText = document.getElementById('reviewText').value.trim();

        // Upload photos if any
        let photoUrls = [];
        if (selectedPhotos.length > 0) {
          photoUrls = await uploadPhotos(clientEmail);
        }

        // Submit review
        const { data, error } = await supabaseClient
          .from('reviews')
          .insert({
            practitioner_id: practitionerId,
            client_id: null, // Off-platform client
            client_name: clientName,
            client_first_name: clientName.split(' ')[0],
            client_last_name: clientName.split(' ').slice(1).join(' '),
            rating: selectedRating,
            review_text: reviewText,
            category_id: selectedCategory,
            source: 'review-link',
            is_verified: false,
            is_featured: false,
            is_visible: true, // Auto-visible
            is_approved: true, // Auto-approved
            review_date: new Date().toISOString(),
            photos: photoUrls.length > 0 ? photoUrls : null,
            moderation_notes: `Off-platform review from ${clientEmail}`
          });

        if (error) throw error;

        showSuccess('Thank you! Your review has been submitted.');
        
        // Reset form
        setTimeout(() => {
          document.getElementById('reviewForm').reset();
          selectedRating = 0;
          selectedCategory = null;
          selectedPhotos = [];
          updateStarDisplay();
          updateRatingLabel();
          renderPhotoPreviews();
          
          // Redirect after 2 seconds
          setTimeout(() => {
            window.location.href = '../';
          }, 2000);
        }, 500);
      } catch (error) {
        console.error('Submission error:', error);
        showError(`Failed to submit review: ${error.message}`);
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = originalText;
      }
    });

    // Upload photos to storage
    async function uploadPhotos(clientEmail) {
      const urls = [];

      for (const photo of selectedPhotos) {
        try {
          const timestamp = Date.now();
          const filename = `${timestamp}-${photo.name}`;
          const path = `reviews/${practitionerId}/${filename}`;

          const { data, error } = await supabaseClient.storage
            .from('review-files')
            .upload(path, photo.file);

          if (error) throw error;

          // Get public URL
          const { data: urlData } = supabaseClient.storage
            .from('review-files')
            .getPublicUrl(path);

          urls.push(urlData.publicUrl);
        } catch (error) {
          console.error('Photo upload error:', error);
          showError(`Failed to upload photo: ${error.message}`);
        }
      }

      return urls;
    }

    // Utility functions
    function showError(message) {
      const el = document.getElementById('errorMessage');
      el.textContent = message;
      el.classList.add('show');
      console.error('Error shown to user:', message);
      setTimeout(() => el.classList.remove('show'), 5000);
    }

    function showSuccess(message) {
      const el = document.getElementById('successMessage');
      el.textContent = message;
      el.classList.add('show');
      console.log('Success shown to user:', message);
    }

    // Check internet connectivity
    function checkConnectivity() {
      if (!navigator.onLine) {
        showError('No internet connection. Please check your network.');
        return false;
      }
      return true;
    }

    // Start
    console.log('Document ready, starting init...');
    if (checkConnectivity()) {
      init();
    }
  </script>
</body>
</html>
