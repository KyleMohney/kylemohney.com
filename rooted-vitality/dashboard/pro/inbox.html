<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inbox - Rooted Vitality Practitioner</title>
    <link rel="stylesheet" href="../../styles/base.css">
    <link rel="stylesheet" href="../../styles/layout.css">
    <link rel="stylesheet" href="../../styles/components.css">
    <link rel="stylesheet" href="../../styles/inbox.css">
</head>
<body>
    <!-- Header Injection -->
    <div id="header-inject"></div>

    <main class="inbox-container">
        <!-- Left Navigation Column -->
        <aside class="inbox-sidebar">
            <div class="inbox-header">
                <h1>Messages</h1>
            </div>

            <nav class="inbox-nav">
                <button class="inbox-nav-item active" data-filter="all">
                    <span class="nav-label">Messages</span>
                    <span class="nav-badge" id="badge-all">0</span>
                </button>
                <button class="inbox-nav-item" data-filter="unread">
                    <span class="nav-label">Unread</span>
                    <span class="nav-badge" id="badge-unread">0</span>
                </button>
                <button class="inbox-nav-item" data-filter="hired">
                    <span class="nav-label">Hired</span>
                    <span class="nav-badge" id="badge-hired">0</span>
                </button>
                <button class="inbox-nav-item" data-filter="archive">
                    <span class="nav-label">Archive</span>
                    <span class="nav-badge" id="badge-archive">0</span>
                </button>
            </nav>

            <div class="inbox-search">
                <input 
                    type="text" 
                    id="search-conversations" 
                    class="search-input" 
                    placeholder="Search conversations..."
                >
            </div>

            <div class="inbox-threads-list" id="threads-list">
                <!-- Conversation threads rendered here -->
            </div>
        </aside>

        <!-- Right Content Column -->
        <section class="inbox-content">
            <!-- Empty State -->
            <div class="inbox-empty-state" id="empty-state">
                <div class="empty-icon">💭</div>
                <h2>No conversations yet</h2>
                <p>Select a conversation from the left to get started</p>
            </div>

            <!-- Conversation Thread View -->
            <div class="conversation-thread" id="conversation-thread" style="display: none;">
                <div class="thread-header">
                    <div class="thread-header-info">
                        <div class="thread-avatar">
                            <img id="thread-avatar" src="" alt="Avatar">
                        </div>
                        <div class="thread-header-text">
                            <h2 id="thread-name">Conversation</h2>
                            <p id="thread-status">Online</p>
                        </div>
                    </div>
                    <button class="thread-close-btn" id="close-thread">×</button>
                </div>

                <div class="thread-messages" id="thread-messages">
                    <!-- Messages rendered here -->
                </div>

                <div class="thread-input-area">
                    <input 
                        type="text" 
                        id="message-input" 
                        class="message-input" 
                        placeholder="Type your message... (Connected later)"
                        disabled
                    >
                    <button class="message-send-btn" id="send-message-btn" disabled>
                        <span>Send</span>
                    </button>
                </div>
            </div>

            <!-- Conversation List View (Thread Detail) -->
            <div class="conversation-list" id="conversation-list" style="display: none;">
                <div class="list-header">
                    <button class="list-back-btn" id="back-to-threads">← Back</button>
                    <h2 id="list-title">Messages</h2>
                </div>

                <div class="list-messages" id="list-messages">
                    <!-- Conversation previews rendered here -->
                </div>
            </div>
        </section>
    </main>

    <!-- Footer Injection -->
    <footer id="footer-inject"></footer>

    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <!-- Rooted Vitality Scripts -->
    <script src="../../scripts/config.js"></script>
    <script src="../../scripts/authManager.js"></script>
    <script src="../../scripts/authModal.js"></script>
    <script src="../../scripts/authHooks.js"></script>
    <script src="../../injections.js"></script>
    <script src="../../scripts/inboxManager.js"></script>
</body>
</html>
