<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login - Rooted Vitality</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: linear-gradient(135deg, #77883e 0%, #5a6830 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .login-container {
      background: white;
      border-radius: 12px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      padding: 48px;
      width: 100%;
      max-width: 420px;
    }

    .logo {
      text-align: center;
      margin-bottom: 32px;
    }

    .logo h1 {
      color: #77883e;
      font-size: 28px;
      margin-bottom: 8px;
      font-weight: 600;
    }

    .logo p {
      color: #666;
      font-size: 14px;
    }

    .badge {
      display: inline-block;
      background: #f0f5e8;
      color: #77883e;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 12px;
      margin-top: 8px;
      font-weight: 600;
    }

    .login-form {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    label {
      font-weight: 600;
      color: #333;
      font-size: 14px;
    }

    input {
      padding: 12px 16px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 14px;
      transition: all 0.3s ease;
    }

    input:focus {
      outline: none;
      border-color: #77883e;
      box-shadow: 0 0 0 3px rgba(119, 136, 62, 0.1);
    }

    .button-group {
      margin-top: 24px;
    }

    button {
      width: 100%;
      padding: 12px 24px;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .btn-login {
      background: #77883e;
      color: white;
    }

    .btn-login:hover {
      background: #5a6830;
    }

    .btn-login:disabled {
      background: #ccc;
      cursor: not-allowed;
    }

    .error {
      color: #d32f2f;
      font-size: 14px;
      padding: 12px;
      background: #ffebee;
      border-radius: 8px;
      display: none;
      margin-bottom: 16px;
    }

    .success {
      color: #388e3c;
      font-size: 14px;
      padding: 12px;
      background: #e8f5e9;
      border-radius: 8px;
      display: none;
      margin-bottom: 16px;
    }

    .info {
      background: #f0f5e8;
      color: #5a6830;
      padding: 12px;
      border-radius: 8px;
      font-size: 13px;
      line-height: 1.5;
      margin-top: 16px;
    }

    .loading {
      display: none;
      text-align: center;
      color: #666;
      margin-top: 16px;
    }

    .spinner {
      display: inline-block;
      width: 16px;
      height: 16px;
      border: 2px solid #f3f3f3;
      border-top: 2px solid #77883e;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-right: 8px;
      vertical-align: middle;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="logo">
      <h1>Admin Portal</h1>
      <p>Rooted Vitality</p>
      <span class="badge">Admin Access Only</span>
    </div>

    <div id="error-message" class="error"></div>
    <div id="success-message" class="success"></div>

    <form id="login-form" class="login-form">
      <div class="form-group">
        <label for="email">Admin Email</label>
        <input 
          type="email" 
          id="email" 
          placeholder="admin@rootedvitality.health"
          required
        >
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input 
          type="password" 
          id="password" 
          placeholder="••••••••"
          required
        >
      </div>

      <div class="button-group">
        <button type="submit" class="btn-login">Sign In</button>
      </div>
    </form>

    <div class="info">
      ℹ️ Only team members with @rootedvitality.health email addresses can access the admin panel.
    </div>

    <div id="loading" class="loading">
      <span class="spinner"></span>
      <span>Authenticating...</span>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = 'https://racsktdyrvepyvndbjzs.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJhY3NrdGR5cnZlcHl2bmRianpzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjE3ODIyNDUsImV4cCI6MjA3NzM1ODI0NX0.5a0HksN7H1r5qBMExzKa9mPY-5uzTcJhffRuc5gNU2M';
    const ADMIN_EMAIL_DOMAIN = '@rootedvitality.health';

    let supabaseClient;

    // Initialize Supabase
    function initializeSupabase() {
      supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    }

    // Show error message
    function showError(message) {
      const errorDiv = document.getElementById('error-message');
      errorDiv.textContent = message;
      errorDiv.style.display = 'block';
      document.getElementById('loading').style.display = 'none';
    }

    // Clear messages
    function clearMessages() {
      document.getElementById('error-message').style.display = 'none';
      document.getElementById('success-message').style.display = 'none';
    }

    // Show loading
    function showLoading() {
      document.getElementById('loading').style.display = 'block';
    }

    // Hide loading
    function hideLoading() {
      document.getElementById('loading').style.display = 'none';
    }

    // Email/Password login
    async function loginWithPassword(e) {
      e.preventDefault();
      
      try {
        clearMessages();
        showLoading();

        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value;

        if (!email.endsWith(ADMIN_EMAIL_DOMAIN)) {
          throw new Error(`Email must be a ${ADMIN_EMAIL_DOMAIN} address`);
        }

        if (!password || password.length < 6) {
          throw new Error('Password must be at least 6 characters');
        }

        const { data, error } = await supabaseClient.auth.signInWithPassword({
          email: email,
          password: password,
        });

        if (error) {
          throw error;
        }

        if (data?.session) {
          // Redirect to admin panel
          window.location.href = '/rooted-vitality/admin/index.html';
        }
      } catch (error) {
        console.error('[Admin Login] Login error:', error);
        showError(`Login failed: ${error.message}`);
        hideLoading();
      }
    }

    // Event listeners
    document.addEventListener('DOMContentLoaded', () => {
      initializeSupabase();
      document.getElementById('login-form').addEventListener('submit', loginWithPassword);
    });
  </script>
</body>
</html>
